[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ezRPC"
version = "2.0.0"
description = "Convenient RPC over raw QUIC with MessagePack."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aioquic>=1.2.0",
    "msgspec>=0.19.0",
    "cryptography>=42.0.0",
    "certifi",
    "xxhash>=3.0",
]

[project.urls]
Homepage = "https://github.com/kermit-frogs19/ezRPC"

[project.optional-dependencies]
jwt = ["pyjwt>=2.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "pyjwt>=2.0", "mypy>=1.14"]

[tool.setuptools.packages.find]
include = ["ezRPC*"]

[tool.setuptools.package-data]
ezRPC = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
files = ["ezRPC"]
python_version = "3.11"
